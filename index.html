<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vionda – Webdesign aus Ried im Innkreis</title>
<meta name="description" content="Vionda – Webdesign aus Ried im Innkreis, Oberösterreich. Bald online.">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12202E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F6F7;--ink:#12202E;--muted:#56657A;--teal:#0B7A6A;--line:#DCE2E8;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--paper:#0D1620;--ink:#E8EEF3;--muted:#9AAABB;--teal:#22C3AA;--line:#24364A;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:17px/1.6 'Figtree',system-ui,sans-serif;background:
  radial-gradient(60% 60% at 80% 20%, color-mix(in srgb,var(--teal) 14%,transparent), transparent 70%),var(--paper);
  color:var(--ink);display:flex;flex-direction:column;padding:28px max(20px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font:800 1.5rem 'Bricolage Grotesque',Arial,sans-serif;letter-spacing:-.03em}
.brand svg{width:40px;height:40px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;padding-block:48px}
.place{color:var(--teal);font-weight:600;margin-bottom:14px}
h1{font:800 clamp(2.4rem,7vw,4rem)/1.03 'Bricolage Grotesque',Arial,sans-serif;letter-spacing:-.035em;margin-bottom:18px}
p.lead{color:var(--muted);font-size:1.15rem;max-width:44ch;margin-bottom:28px}
.row{display:flex;gap:12px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;text-decoration:none;background:var(--ink);color:var(--paper)}
a.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
footer{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#12202E"/><path d="M17 19 L32 46 L47 19" fill="none" stroke="#14B8A0" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="15" r="5" fill="#F2A93B"/></svg>vionda</div>
<main>
  <p class="place">Ried im Innkreis, Oberösterreich</p>
  <h1>Hier entsteht gerade etwas Neues.</h1>
  <p class="lead">Vionda baut moderne Websites für Betriebe und Vereine im Innviertel. Die Seite ist bald online – bis dahin erreichst du uns per E-Mail.</p>
  <div class="row">
    <a class="btn" href="mailto:hallo@vionda.at">hallo@vionda.at</a>
    <a class="btn alt" href="portal/">Team-Login</a>
  </div>
</main>
<footer>© 2026 Vionda · Ried im Innkreis</footer>
</body>
</html>
